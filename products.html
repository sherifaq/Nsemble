<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./images/icon.svg" type="image/png">
    <title>The Edit | Nsemble</title>
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <!-- زر القائمة الجانبية للموبايل -->
            <button id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <div class="logo">
                <a href="./index.html"><img src="./images/logo.svg" alt="Nsemble Logo" width="150"></a>
            </div>
            
            <nav class="nav" id="main-nav">
                <a href="./index.html">Home</a>
                <a href="./products.html">The Edit</a>
                <a href="./brands.html">Brands</a>
                <a href="./about.html">Our Story</a>
                <a href="./contact.html">Contact</a>
            </nav>
            
            <div class="header-actions search-container">
                <input type="text" id="search-input" placeholder="Search..." class="search-bar">
                <button id="search-btn" aria-label="Search">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
        </div>
    </header>
    
    <main class="container section-padding">
        <div class="catalog-layout">
            <aside class="sidebar-filters">
                <h3>Filters</h3>
                <div class="filter-group">
                    <h4>Category</h4>
                    <select id="category-filter">
                        <option value="all">All</option>
                        <option value="fragrances">Fragrances</option>
                        <option value="handbags">Handbags</option>
                        <option value="beauty">Beauty</option>
                        <option value="skincare">Skincare</option>
                        <option value="Bala7">Bala7</option>
                    </select>
                </div>
                <div class="filter-group">
                    <h4>Brand</h4>
                    <select id="brand-filter">
                        <option value="all">All</option>
                    </select>
                </div>
                <div class="filter-group">
                    <h4>Sort By</h4>
                    <select id="sort-filter">
                        <option value="newest">Newest</option>
                        <option value="popular">Popular</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                    </select>
                </div>
            </aside>
            <section class="products-grid grid grid-3" id="main-catalog-grid">
                <!-- Populated by JS -->
            </section>
        </div>
    </main>
    
    <footer class="footer"><!-- Refer to index.html footer --></footer>
    
    <script src="./js/products.js" defer></script>
    <script src="./js/search.js" defer></script>
    <script src="./js/filters.js" defer></script>
    <script src="./js/app.js" defer></script>
</body>
</html>
